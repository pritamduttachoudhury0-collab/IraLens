# Modified by IraLens Contributors (2026-10-17) under Apache-2.0 Section 4(b):
# Scoped obscura-cli dependencies to the vendored MCP/browser workspace crates.

[package]
name = "obscura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "obscura"
path = "src/main.rs"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth", "obscura-mcp/stealth"]
render = ["obscura-browser/render", "obscura-mcp/render"]

[dependencies]
obscura-browser = { workspace = true }
obscura-mcp = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
