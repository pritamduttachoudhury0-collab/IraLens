# Modified by IraLens Contributors (2026-10-17) under Apache-2.0 Section 4(b):
# Decoupled optional obscura-render rasterizer dependency so the vendored
# workspace compiles without the 18 MB embedded font/rasterization crate.

[package]
name = "obscura-js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
stealth = ["obscura-net/stealth"]
render = []

[build-dependencies]
deno_core = "0.412"

[dependencies]
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
deno_core = "0.412"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
psl = "2"
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
html5ever = { workspace = true }
deno_error = "0.7"
base64 = { workspace = true }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
getrandom = "0.2"
