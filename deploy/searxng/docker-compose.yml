# Self-hosted SearXNG for IraLens — see deploy/searxng/README.md
#
#   cd deploy/searxng && docker compose up -d
#   export IRALENS_SEARXNG_INSTANCES="http://127.0.0.1:8888"
#   export IRALENS_ALLOWED_PRIVATE_HOSTS="127.0.0.1:8888"
#
# The instance is bound to loopback only: it is yours, not a public service.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: iralens-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  searxng-data:
