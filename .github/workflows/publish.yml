name: Publish to PyPI

# The release artifacts (sdist + wheel) are built and attached to every
# GitHub release by hand (see docs/releasing.md), so a release always has
# installable files even if this workflow never runs.
#
# This workflow publishes the same artifacts to PyPI using *trusted
# publishing*: the job exchanges its GitHub OIDC token for a short-lived
# PyPI upload token, so no API token is ever stored in the repository.
#
# It needs one thing configured on the PyPI side, once, by the project's
# owner: a pending publisher for this repository and this workflow
# (https://pypi.org/manage/project/iralens/settings/publishing/).
# Until then the workflow fails with "no publisher for this project",
# which is the honest outcome — the release itself is unaffected.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the distribution
        run: |
          python -m build

      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*
          python -m zipfile -l dist/*.whl | head -20

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
