[project]
name = "half-iralens"
version = "0.1.0"
description = "Half IraLens — one unified Internet-access system: search, read, browse, and specialized source access behind a single interface."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai-agent", "internet-access", "browser", "web-search", "mcp", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
halfiralens = "halfiralens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["halfiralens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
