[project]
name = "iralens"
version = "0.2.0"
description = "IraLens — one unified Internet-access system: search, read, browse, and specialized source access behind a single interface."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["ai-agent", "internet-access", "browser", "web-search", "mcp", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.4.9",
    # PDF main-text extraction for the read path (BSD-3-Clause). Without it a
    # PDF read fails with a typed pdf_support_missing error instead of
    # returning binary noise (D-083).
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
iralens = "iralens.cli:main"
iralens-api = "iralens.api:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iralens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Third-party deps without type stubs (PyYAML, feedparser, yt-dlp, requests)
# are not re-checked; every iralens module itself is.
ignore_missing_imports = true
