[project]
name = "iralens"
version = "0.3.5"
description = "IraLens — one unified Internet-access system: search, read, browse, and specialized source access behind a single interface."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["ai-agent", "internet-access", "browser", "web-search", "mcp", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.4.9",
    # PDF main-text extraction for the read path (BSD-3-Clause). Without it a
    # PDF read fails with a typed pdf_support_missing error instead of
    # returning binary noise.
    "pypdf>=4.0",
    # Isolated V8 runtime (libmini_racer, ISC) used by the internally vendored
    # browser engine subsystem (iralens._internal.browser_engine).
    "mini-racer>=0.14.0,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
# Optional: TLS/HTTP2 fingerprint impersonation for the browser engine's
# stealth tier. Without it the engine still works and reports the
# capability as unavailable rather than pretending.
stealth = ["curl_cffi>=0.7"]

[project.scripts]
iralens = "iralens.cli:main"
iralens-api = "iralens.api:main"
iralens-browser-engine = "iralens._internal.browser_engine.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["iralens*"]

[tool.setuptools.package-data]
"iralens._internal.browser_engine" = [
    "*.js",
    "*.md",
    "bin/*",
    "vendor/obscura/*",
    "vendor/obscura/crates/*/*",
    "vendor/obscura/crates/*/*/*",
    "vendor/obscura/crates/*/*/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Third-party deps without type stubs (PyYAML, feedparser, yt-dlp, requests)
# are not re-checked; every iralens module itself is.
ignore_missing_imports = true
